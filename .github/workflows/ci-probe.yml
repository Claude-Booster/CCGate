# THROWAWAY spike (delete after use). Answers three Track-B-in-CI questions:
#   1. AUTH   — does CLAUDE_CODE_OAUTH_TOKEN authenticate the SDK in a runner?
#   2. POLICY — does the org managed policy (allowManagedHooksOnly) reach a CI
#               runner (follows the account) or not (follows the machine)?
#   3. EGRESS — does the API call complete from the runner?
# workflow_dispatch ONLY: no pull_request(_target), no PR-authored code in the token job.
name: ci-probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install claude CLI + agent SDK
        run: |
          npm install -g @anthropic-ai/claude-code
          pip install claude-agent-sdk anyio
          claude --version || true
      - name: Probe (auth / egress / SDK hook enforcement)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          python - <<'PY'
          import anyio
          from claude_agent_sdk import query, ClaudeAgentOptions, HookMatcher

          pre = []
          async def pre_hook(inp, tool_use_id, ctx):
              pre.append(inp.get("tool_name"))
              return {"hookSpecificOutput": {"hookEventName": "PreToolUse",
                      "permissionDecision": "deny", "permissionDecisionReason": "ci-probe deny"}}

          async def stream():
              yield {"type": "user",
                     "message": {"role": "user", "content": "Use the Bash tool to run: echo hi"},
                     "parent_tool_use_id": None, "session_id": "ci-probe"}

          async def main():
              opts = ClaudeAgentOptions(
                  setting_sources=[], permission_mode="default",
                  disallowed_tools=["Task"],
                  hooks={"PreToolUse": [HookMatcher(matcher=None, hooks=[pre_hook])]},
                  max_turns=3, model="claude-haiku-4-5-20251001")
              got_result = False; err = None
              try:
                  async for m in query(prompt=stream(), options=opts):
                      if type(m).__name__ == "ResultMessage":
                          got_result = True
              except Exception as e:
                  err = f"{type(e).__name__}: {e}"
              print("PROBE_AUTH_EGRESS:", "OK" if got_result else f"FAIL ({err})")
              print("PROBE_SDK_PRETOOL_HOOK_FIRED:", len(pre), pre)
          anyio.run(main)
          PY
      - name: Policy-reach check (did the org managed policy reach this runner?)
        if: always()
        run: |
          echo "=== ~/.claude contents ==="
          ls -la ~/.claude/ 2>/dev/null || echo "no ~/.claude dir"
          for f in ~/.claude/policy-limits.json ~/.claude/policy-limits.json.stamp.json; do
            if [ -f "$f" ]; then echo "PROBE_POLICY_FILE_PRESENT: $(basename "$f")"; cat "$f"; else echo "PROBE_POLICY_FILE_ABSENT: $(basename "$f")"; fi
          done
          if grep -rlq "allowManagedHooksOnly" ~/.claude/ 2>/dev/null; then
            echo "PROBE_POLICY_REACH: allowManagedHooksOnly PRESENT in CI (policy follows the account)"
          else
            echo "PROBE_POLICY_REACH: no allowManagedHooksOnly marker (policy does NOT reach this runner)"
          fi
